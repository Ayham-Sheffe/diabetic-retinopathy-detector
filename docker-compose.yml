services:
  postgresql:
    # 1. الصورة (Image)
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: pgvector
    
    # 2. المنافذ (Ports)
    ports:
      - "5432:5432"
    
    # 3. وحدات التخزين (Volumes)
    volumes:
      - postgresdata:/var/lib/postgresql/18/docker
      
    # 4. متغيرات البيئة (Environment Variables)
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      
    # 5. الشبكة وإعادة التشغيل
    networks:
      - backend
    restart: always

# 6. تعريف الشبكات ووحدات التخزين
networks:
  backend:
    driver: bridge

volumes:
  postgresdata: